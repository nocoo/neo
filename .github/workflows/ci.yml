name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: 1.4.2
      install-policy: blocked
      coverage-path: coverage
      extra-install-dirs: worker
      prepare-command: bun run build
      test-command: bun run test:coverage
      typecheck-command: bun run typecheck
      l2-command: bun run test:api
      l3-command: bun run test:e2e:bdd
      l3-browser: chromium
      security: true
      worker: true
      l2: true
      l3: true
  release-smoke:
    name: Release Workflow Smoke
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      yamllint: true
permissions:
  contents: read
