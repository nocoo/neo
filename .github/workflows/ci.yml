# System0 quality slots — native mode (base-ci v2026.15).
# Keep the job key `quality` without a display name so every slot renders as
# `quality / <ID>: <Name>` and branch protection needs only `quality / Z1: Gate`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
